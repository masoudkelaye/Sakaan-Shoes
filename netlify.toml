[build]
  publish = "."

# Admin panel entry point
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Basic security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Product/settings JSON: always revalidate so admin edits show up quickly
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
