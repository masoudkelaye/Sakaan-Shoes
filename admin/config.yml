# ============================================
# SAKAAN SHOES - ADMIN PANEL CONFIGURATION
# ============================================

backend:
  name: git-gateway
  branch: main

# Where uploaded images are stored in the repository
media_folder: "data/images/uploads"
# The public URL path for those images
public_folder: "/data/images/uploads"

local_backend: true

collections:
  # ---------- SITE SETTINGS ----------
  - name: "settings"
    label: "⚙️ Site Settings | إعدادات الموقع"
    files:
      - name: "general"
        label: "General Settings | الإعدادات العامة"
        file: "data/settings.json"
        fields:
          - label: "Site Name (English)"
            name: "siteNameEn"
            widget: "string"
          - label: "Site Name (Arabic)"
            name: "siteNameAr"
            widget: "string"
          - label: "Tagline (English)"
            name: "taglineEn"
            widget: "string"
          - label: "Tagline (Arabic)"
            name: "taglineAr"
            widget: "string"
          - label: "Logo Image"
            name: "logo"
            widget: "image"
            required: false
          - label: "WhatsApp Number"
            name: "whatsapp"
            widget: "string"
            hint: "Country code + number, no + or spaces (example: 9639XXXXXXXX)"
          - label: "Facebook URL"
            name: "facebook"
            widget: "string"
          - label: "Instagram URL"
            name: "instagram"
            widget: "string"
          - label: "Default Language"
            name: "defaultLang"
            widget: "select"
            options: ["en", "ar"]

  # ---------- PRODUCTS ----------
  - name: "products"
    label: "👟 Products / Shoes | المنتجات"
    files:
      - name: "all-products"
        label: "All Products | كل المنتجات"
        file: "data/products.json"
        fields:
          - label: "Products List"
            name: "products"
            widget: "list"
            summary: "{{titleEn}} / {{titleAr}}"
            fields:
              - label: "ID (optional, not used by the website)"
                name: "id"
                widget: "number"
                value_type: "int"
                required: false
              - label: "Title (English)"
                name: "titleEn"
                widget: "string"
              - label: "Title (Arabic)"
                name: "titleAr"
                widget: "string"
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Men / رجالي", value: "men" }
                  - { label: "Women / نسائي", value: "women" }
                  - { label: "Kids / أطفال", value: "kids" }
              - label: "Category Label (English) - optional"
                name: "categoryLabelEn"
                widget: "string"
                required: false
                hint: "Leave empty to use the default (Men / Women / Kids)"
              - label: "Category Label (Arabic) - optional"
                name: "categoryLabelAr"
                widget: "string"
                required: false
                hint: "Leave empty to use the default"
              - label: "Description (English)"
                name: "descriptionEn"
                widget: "text"
              - label: "Description (Arabic)"
                name: "descriptionAr"
                widget: "text"
              - label: "Photo"
                name: "image"
                widget: "image"
              - label: "Sort Order"
                name: "order"
                widget: "number"
                value_type: "int"
                default: 100
                hint: "Lower number appears first in the gallery"
